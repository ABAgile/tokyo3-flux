# Markdown lint/format for Flux docs; `make fmt-md` rewrites to one sentence per line.
[global]
include = ["README.md", "DESIGN.md", "docs/**/*.md", ".pi/skills/**/SKILL.md"]

[MD013]
reflow = true
reflow-mode = "sentence-per-line"
abbreviations = []
# Sentence-per-line lines are as long as their sentence; tables are not wrapped.
paragraphs = false
tables = false
