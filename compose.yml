# Native Flux planning examination stack.
# Copy .env.example to .env and configure the session key and GitLab OAuth.
#   docker compose up --build -d
# Then bootstrap a workspace with your GitLab numeric user ID; see
# README.md#compose.
#
# Examination only: the bundled DB uses one role and non-SSL connections.
# Its development credentials are not suitable for production. No DB port is
# published. The browser still requires authenticated OAuth sessions.

name: ${COMPOSE_PROJECT_NAME:-flux}

x-flux-build: &flux-build
  context: .
  target: server
  args:
    VERSION: ${VERSION:-dev-docker}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: flux
      POSTGRES_USER: flux
      POSTGRES_PASSWORD: flux
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flux -d flux"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    build: *flux-build
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The same URL is used for migration, operator commands, and serving.
      FLUX_DATABASE_URL: &database-url "postgres://flux:flux@db:5432/flux?sslmode=disable"

  flux:
    build: *flux-build
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${FLUX_BIND_ADDR:-127.0.0.1}:${FLUX_PORT:-8080}:8080"
    environment:
      TZ: "${TZ:-UTC}"
      FLUX_ADDR: ":8080"
      FLUX_DATABASE_URL: *database-url

      # Optional workspace-scoped, read-only machine access.
      FLUX_API_TOKEN: "${FLUX_API_TOKEN:-}"
      FLUX_API_SUBJECT: "${FLUX_API_SUBJECT:-}"

      # Sealed browser session key. Generate with: openssl rand -hex 32
      FLUX_SESSION_KEY: "${FLUX_SESSION_KEY:?set FLUX_SESSION_KEY to 64 hex characters}"

      # Native observations reuse the configured GitLab instance and read token.
      FLUX_GITLAB_SERVICE_TOKEN: "${FLUX_GITLAB_SERVICE_TOKEN:-}"
      FLUX_GITLAB_REFRESH_INTERVAL: "${FLUX_GITLAB_REFRESH_INTERVAL:-1m}"
      FLUX_GITLAB_WEBHOOK_SECRET: "${FLUX_GITLAB_WEBHOOK_SECRET:-}"

      # Browser OAuth login, independent of observation credentials.
      FLUX_GITLAB_URL: "${FLUX_GITLAB_URL:?set FLUX_GITLAB_URL}"
      FLUX_GITLAB_OAUTH_CLIENT_ID: "${FLUX_GITLAB_OAUTH_CLIENT_ID:?set FLUX_GITLAB_OAUTH_CLIENT_ID}"
      FLUX_GITLAB_OAUTH_CLIENT_SECRET: "${FLUX_GITLAB_OAUTH_CLIENT_SECRET:?set FLUX_GITLAB_OAUTH_CLIENT_SECRET}"
      FLUX_GITLAB_OAUTH_REDIRECT_URL: "${FLUX_GITLAB_OAUTH_REDIRECT_URL:?set FLUX_GITLAB_OAUTH_REDIRECT_URL}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  db:
