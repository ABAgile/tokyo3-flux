<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flux · Planning</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body>
<a class="skip" href="#main">Skip to planning</a>
<aside class="sidebar">
 <a class="brand" href="/" aria-label="Flux home"><span class="mark">F</span> flux <small>PLANNING</small></a>
 <div class="workspace-field"><div class="workspace-label-row"><label for="workspace">Workspace</label><button id="refresh" class="icon-button" type="button" aria-label="Refresh" title="Refresh workspace"><span aria-hidden="true">↻</span></button></div><select id="workspace" aria-label="Workspace"></select></div>
 <nav aria-label="Planning views"><button data-view="board" aria-current="page"><span class="nav-icon" aria-hidden="true">▦</span><span>Kanban board</span></button><button data-view="sprints"><span class="nav-icon" aria-hidden="true">◷</span><span>Sprints</span></button><button data-view="projects"><span class="nav-icon" aria-hidden="true">▤</span><span>Projects</span></button><button data-view="members"><span class="nav-icon" aria-hidden="true">♙</span><span>Members</span></button><button data-view="labels"><span class="nav-icon" aria-hidden="true">▥</span><span>Labels</span></button><button data-view="archive"><span class="nav-icon" aria-hidden="true">▣</span><span>Archive</span></button><button data-view="history"><span class="nav-icon" aria-hidden="true">↺</span><span>History</span></button></nav>
 <div class="sidebar-foot"><div class="sidebar-session"><button id="theme" class="icon-button theme-toggle" type="button" aria-label="Switch theme" title="Switch theme"><span aria-hidden="true">☾</span></button><div class="sidebar-account"><span id="identity">Loading session…</span><a href="/auth/logout">Sign out</a></div></div></div>
</aside>
<main id="main" tabindex="-1">
 <div class="heading"><div><h1 id="title">Kanban board</h1><p id="subtitle" class="muted">A shared view of what matters next.</p></div><div class="actions"><button id="proposals">Proposals</button><button id="columns" data-write>Board setup</button><button id="new-item" class="primary" data-write>＋ New item</button></div></div>
 <p id="notice" role="status" aria-live="polite">Loading planning data…</p>
 <section id="sprint-summary" class="sprints" aria-label="Active sprints"></section>
 <div class="toolbar"><div class="actions"><label id="scope-label">Scope<select id="scope"><option value="active" selected>Active sprints</option><option value="backlog">Backlog</option><option value="all">All open work</option></select></label><label>Project<select id="project" aria-label="Project"><option value="all">All projects</option><option value="none">No project</option></select></label><label>Assignee<select id="assignee" aria-label="Assignee"><option value="all">All assignees</option><option value="none">Unassigned</option></select></label><label id="label-filter">Label<select id="label" aria-label="Label"><option value="all">All labels</option><option value="none">No labels</option></select></label><label id="search-filter">Search<input id="search" type="search" placeholder="Find work…" maxlength="240"></label></div><span id="count" class="muted"></span></div>
 <section id="content" aria-label="Planning content" aria-busy="true"></section>
</main>
<dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title">Work item</h2><button type="button" id="dismiss" aria-label="Close editor">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="dialog-foot"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary" id="save">Save changes</button></div></form></dialog>
</body></html>
