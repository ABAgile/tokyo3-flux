<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flux · Planning</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head>
<body>
<a class="skip" href="#main">Skip to planning</a>
<aside class="sidebar">
 <a class="brand" href="/" aria-label="Flux home"><span class="mark">F</span> flux <small>PLANNING</small></a>
 <label>Workspace<select id="workspace" aria-label="Workspace"></select></label>
 <nav aria-label="Planning views"><button data-view="board" aria-current="page">▦ &nbsp; Kanban board</button><button data-view="backlog">☷ &nbsp; Backlog</button><button data-view="sprints">◷ &nbsp; Sprints</button><button data-view="archive">▣ &nbsp; Archive</button><button data-view="history">↺ &nbsp; History</button></nav>
 <div class="sidebar-foot"><p class="eyebrow">YOUR WORK. YOUR SOURCE OF TRUTH.</p><p>Native planning, independent of GitLab.</p><button id="theme" class="quiet">Switch theme</button><a href="/auth/logout">Sign out</a></div>
</aside>
<main id="main" tabindex="-1">
 <header class="topbar"><span id="identity">Loading session…</span><span id="mode" class="badge">Native planning</span></header>
 <div class="heading"><div><p class="eyebrow" id="breadcrumb">TEAM WORKSPACE</p><h1 id="title">Kanban board</h1><p id="subtitle" class="muted">A shared view of what matters next.</p></div><div class="actions"><button id="refresh">Refresh</button><button id="projects" data-write>Projects</button><button id="labels" data-write>Labels</button><button id="members" data-write>Members</button><button id="integration" data-write>Integration</button><button id="proposals">Proposals</button><button id="columns" data-write>Board setup</button><button id="new-item" class="primary" data-write>＋ New item</button></div></div>
 <p id="notice" role="status" aria-live="polite">Loading planning data…</p>
 <section id="sprint-summary" class="sprints" aria-label="Active sprints"></section>
 <div class="toolbar"><div class="actions"><label id="scope-label">Scope<select id="scope"><option value="all">All open work</option><option value="active">Active sprints</option><option value="backlog">Backlog</option></select></label><label>Project<select id="project" aria-label="Project"><option value="all">All projects</option><option value="none">No project</option></select></label><label>Label<select id="label" aria-label="Label"><option value="all">All labels</option><option value="none">No labels</option></select></label><label>Search<input id="search" type="search" placeholder="Find work…" maxlength="240"></label></div><span id="count" class="muted"></span></div>
 <section id="content" aria-label="Planning content" aria-busy="true"></section>
</main>
<dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><div class="dialog-head"><h2 id="editor-title">Work item</h2><button type="button" id="dismiss" aria-label="Close editor">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="dialog-foot"><button type="button" id="cancel">Cancel</button><button type="submit" class="primary" id="save">Save changes</button></div></form></dialog>
</body></html>
