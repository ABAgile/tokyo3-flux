name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: flux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux -d flux_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLUX_TEST_DATABASE_URL: postgres://flux:fixture-password@127.0.0.1:5432/flux_test?sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('go.mod') }}-${{ steps.setup-go.outputs.go-version }}

      - name: Install Go analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/tools/gopls@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install golang.org/x/tools/cmd/deadcode@latest

      - name: Check Go formatting
        run: |
          files=$(find . -type f -name '*.go' -print0 | xargs -0 gofmt -s -l)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - run: go mod tidy -diff
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: staticcheck ./...
      - run: find . -type f -name '*.go' -print0 | xargs -0 -n 100 gopls check -severity=hint
      - run: govulncheck ./...
      - name: deadcode
        run: |
          out=$(deadcode -test ./...)
          if [ -n "$out" ]; then echo "$out"; echo "deadcode: unreachable functions found (above)"; exit 1; fi

      # Frontend tool versions match BIOME_VERSION and RUMDL_VERSION in the Makefile;
      # check-web runs TypeScript through its pinned TYPESCRIPT_VERSION npx command.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: biomejs/setup-biome@v2
        with:
          version: 2.5.14

      - name: Install rumdl and Pi
        run: |
          pip install rumdl==0.2.77
          npm install -g @earendil-works/pi-coding-agent@0.87.1

      - name: Verify vendored frontend runtime
        run: |
          make vendor-web
          git diff --exit-code -- internal/planningui/static/modules/vendor-preact.js

      - run: make check-web BIOME=biome RUMDL=rumdl

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flux
          POSTGRES_PASSWORD: fixture-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLUX_BROWSER_PG: postgres://flux:fixture-password@127.0.0.1:5432/postgres?sslmode=disable
      PLAYWRIGHT_CLI_SESSION: flux-ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install browser test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm install --global @playwright/cli@0.1.22
          playwright-cli install-browser chromium --with-deps
          echo "FLUX_BROWSER_OUT=$RUNNER_TEMP/flux-browser-results" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_CLI_CONFIG=$RUNNER_TEMP/flux-playwright.json" >> "$GITHUB_ENV"
          printf '%s\n' '{"browser":{"browserName":"chromium","launchOptions":{"channel":"chromium","headless":true}}}' > "$RUNNER_TEMP/flux-playwright.json"
      - name: Run disposable database-backed browser suites
        run: tests/run-browser.sh rendering planning drag-labels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: ${{ runner.temp }}/flux-browser-results
          if-no-files-found: ignore
